name: Build TEKO STORE app icons

on:
  push:
    paths:
      - 'icons/teko-icon-source.base64'
      - '.github/workflows/build-teko-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Decode approved TEKO artwork and resize
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image, ImageOps

          root = Path('icons')
          raw = base64.b64decode((root / 'teko-icon-source.base64').read_text().strip(), validate=True)
          src = Image.open(io.BytesIO(raw)).convert('RGB')
          if src.size != (256, 256):
              raise ValueError('Unexpected TEKO logo source size')
          targets = {
              'favicon-32.png': 32,
              'apple-touch-icon.png': 180,
              'icon-192.png': 192,
              'icon-512.png': 512,
          }
          for filename, size in targets.items():
              out = src.resize((size, size), Image.Resampling.LANCZOS)
              out.save(root / filename, 'PNG', optimize=True)
          src.save('favicon.ico', format='ICO', sizes=[(16,16), (32,32), (48,48)])
          print('Generated TEKO favicon, iPhone, Android and installable app icons')
          PY
      - name: Commit generated icons to GitHub Pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add favicon.ico icons/favicon-32.png icons/apple-touch-icon.png icons/icon-192.png icons/icon-512.png
          if git diff --cached --quiet; then
            echo 'Icon files already up to date.'
            exit 0
          fi
          git commit -m 'assets: generate approved TEKO favicon and mobile icons'
          git push
